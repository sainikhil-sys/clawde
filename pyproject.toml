[project]
name = "clawde"
version = "0.1.0"
description = "Local-first AI assistant platform: API, orchestration and storage."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "structlog>=24.1",
  "httpx>=0.27",
]

[project.scripts]
clawde-api = "api.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Repository layout follows docs/02-architecture.md; each top-level folder is an importable package.
packages = ["apps/api", "services", "storage"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["apps", ".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"storage/database/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api", "services", "storage"]
mypy_path = "apps:."
plugins = ["pydantic.mypy"]
exclude = ["storage/database/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
