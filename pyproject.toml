[project]
name = "clawde"
version = "0.1.0"
description = "Local-first AI assistant platform: API, orchestration and storage."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "structlog>=24.1",
  "httpx>=0.27",
  "pypdf>=7.0.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "pillow>=13.0.0",
  "python-multipart>=0.0.33",
  "faiss-cpu>=1.15.1",
  "numpy>=2.5.4",
  "psutil>=7.2.2",
  "gguf>=0.19.0",
  "huggingface-hub>=2.4.0",
]

[project.optional-dependencies]
# In-process Hugging Face models (Transformers adapter) and, from Milestone 12, training. CPU build of PyTorch.
# Install with: uv sync --extra ml
ml = ["torch>=2.5", "transformers>=4.46"]

[project.scripts]
clawde-api = "api.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Repository layout follows docs/02-architecture.md; each top-level folder is an importable package.
packages = ["apps/api", "core", "models", "services", "storage"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["live: needs a running local Ollama server (skipped automatically if absent)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["apps", ".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"storage/database/migrations/**" = ["E501"]
# Evaluation prompts and phrase lists are data; keeping each on one line keeps them readable.
"core/evaluation/suites.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api", "core", "models", "services", "storage"]
mypy_path = "apps:."
plugins = ["pydantic.mypy"]
exclude = ["storage/database/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "docx", "docx.*", "openpyxl", "openpyxl.*", "faiss", "faiss.*", "psutil", "psutil.*", "gguf", "gguf.*", "torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true
